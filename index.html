<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>12-Week Plan Dashboard</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#f0f6fc; --muted:#8b949e; --g0:#21262d; --g1:#0e4429; --g2:#006d32; --g3:#26a641; --g4:#39d353; }
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)} main{max-width:1180px;margin:0 auto;padding:40px 24px 64px} h1{margin:0 0 8px;font-size:36px;letter-spacing:0} p{color:var(--muted);line-height:1.55}.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.card,.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px}.card{padding:18px}.label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase}.value{font-size:28px;font-weight:800;margin-top:8px}.panel{margin-top:18px;padding:22px}.project{display:grid;grid-template-columns:170px 1fr 70px;align-items:center;gap:16px;margin:12px 0}.project-name{font-weight:700}.heat{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}.cell{width:13px;height:13px;border-radius:3px;flex:0 0 auto;background:var(--g0);outline:1px solid rgba(255,255,255,.04)}.l1{background:var(--g1)}.l2{background:var(--g2)}.l3{background:var(--g3)}.l4,.l5{background:var(--g4)}.score{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}.kanban{grid-template-columns:repeat(5,minmax(0,1fr));margin-top:18px}.lane{background:#0d1117;border:1px solid var(--border);border-radius:8px;min-height:130px;padding:12px}.lane h3{margin:0 0 12px;font-size:14px}.ticket{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:10px;margin-bottom:8px;font-size:13px;color:#c9d1d9}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border-bottom:1px solid var(--border);padding:10px 8px;text-align:left}th{color:var(--muted);font-size:12px;text-transform:uppercase}@media(max-width:900px){.cards,.kanban{grid-template-columns:1fr 1fr}.project{grid-template-columns:1fr}.score{text-align:left}}
  </style>
</head>
<body>
  <main>
    <header><h1>12-Week Plan Dashboard</h1><p>Synced from Obsidian Daily Notes by Codex. Public page contains sanitized project summaries only.</p></header>
    <section class="grid cards">
      <div class="card"><div class="label">Phase</div><div class="value">W11/W12</div></div>
      <div class="card"><div class="label">Target</div><div class="value">85%</div></div>
      <div class="card"><div class="label">Recorded Avg</div><div class="value">57%</div></div>
      <div class="card"><div class="label">Updated</div><div class="value" id="updated">-</div></div>
    </section>
    <section class="panel"><h2>Project Heatmap</h2><div id="heatmap"></div></section>
    <section class="panel"><h2>Recent Events</h2><table><thead><tr><th>Date</th><th>Project</th><th>Score</th><th>Message</th><th>Next</th></tr></thead><tbody id="events"></tbody></table></section>
  </main>
  <script>
    const colors = ['', 'l1', 'l2', 'l3', 'l4', 'l5'];
    function dayOfYear(iso){ const d=new Date(iso+'T00:00:00'); const s=new Date(d.getFullYear(),0,0); return Math.floor((d-s)/86400000); }
    function level(score){ return Math.max(0, Math.min(5, Number(score)||0)); }
    fetch('./data/progress.json').then(r=>r.json()).then(data=>{
      document.getElementById('updated').textContent = (data.generated_at || '').slice(0,10);
      const heatmap = document.getElementById('heatmap');
      for (const project of data.projects) {
        const summary = data.summary[project] || {latest:[], total_score:0};
        const byDay = new Map();
        for (const event of summary.latest || []) byDay.set(dayOfYear(event.date), Math.max(byDay.get(dayOfYear(event.date)) || 0, event.score));
        const row=document.createElement('div'); row.className='project';
        row.innerHTML=`<div class="project-name">${project}</div><div class="heat"></div><div class="score">${summary.total_score||0}</div>`;
        const heat=row.querySelector('.heat');
        for(let i=1;i<=84;i++){ const c=document.createElement('span'); c.className='cell '+colors[level(byDay.get(i)||0)]; heat.appendChild(c); }
        heatmap.appendChild(row);
      }
      const tbody=document.getElementById('events');
      for (const event of data.recent_events.slice(0,12)) {
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${event.date}</td><td>${event.project}</td><td>${event.score}</td><td>${event.message||'-'}</td><td>${event.next||'-'}</td>`;
        tbody.appendChild(tr);
      }
    });
  </script>
</body>
</html>
